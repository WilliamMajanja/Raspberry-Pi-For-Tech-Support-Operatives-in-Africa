<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="70mm" viewBox="0 0 1080 350" role="img" aria-labelledby="title desc">
  <title id="title">Informatics application review path</title>
  <desc id="desc">A review follows intended use, data sources, processing and transfer, validation, human accountability, and correction or appeal.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79538b"/></marker><style>.card{fill:#f8f3fa;stroke:#654078;stroke-width:4;rx:18}.head{font:700 22px sans-serif;fill:#492e5b;text-anchor:middle}.body{font:18px sans-serif;fill:#382f3d;text-anchor:middle}.arr{stroke:#79538b;stroke-width:6;marker-end:url(#arrow)}</style></defs>
  <rect width="1080" height="350" fill="#fff"/>
  <g transform="translate(25 40)">
    <g><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">1. Intended</tspan><tspan x="75" dy="27">use</tspan></text><text class="body" x="75" y="136"><tspan x="75">who decides?</tspan><tspan x="75" dy="23">who bears harm?</tspan></text></g>
    <path class="arr" d="M155 95h20"/><g transform="translate(180)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">2. Data &amp;</tspan><tspan x="75" dy="27">provenance</tspan></text><text class="body" x="75" y="136"><tspan x="75">source · consent</tspan><tspan x="75" dy="23">version · limits</tspan></text></g>
    <path class="arr" d="M335 95h20"/><g transform="translate(360)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">3. Processing</tspan><tspan x="75" dy="27">&amp; transfer</tspan></text><text class="body" x="75" y="136"><tspan x="75">local · cloud</tspan><tspan x="75" dy="23">logs · APIs</tspan></text></g>
    <path class="arr" d="M515 95h20"/><g transform="translate(540)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">4. Validate</tspan><tspan x="75" dy="27">performance</tspan></text><text class="body" x="75" y="136"><tspan x="75">reference · errors</tspan><tspan x="75" dy="23">uncertainty · groups</tspan></text></g>
    <path class="arr" d="M695 95h20"/><g transform="translate(720)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">5. Human</tspan><tspan x="75" dy="27">accountability</tspan></text><text class="body" x="75" y="136"><tspan x="75">qualified review</tspan><tspan x="75" dy="23">clear limits</tspan></text></g>
    <path class="arr" d="M875 95h20"/><g transform="translate(900)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">6. Correction</tspan><tspan x="75" dy="27">&amp; recourse</tspan></text><text class="body" x="75" y="136"><tspan x="75">appeal · delete</tspan><tspan x="75" dy="23">incident response</tspan></text></g>
  </g>
  <text x="540" y="300" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#7b3434">A polished interface, model score, or README does not establish safety or validity.</text>
</svg>
