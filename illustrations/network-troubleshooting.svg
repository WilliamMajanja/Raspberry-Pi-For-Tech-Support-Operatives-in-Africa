<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="58mm" viewBox="0 0 1050 290" role="img" aria-labelledby="title desc">
  <title id="title">Local network troubleshooting layers</title>
  <desc id="desc">Check physical link, interface address, default route, approved name resolver, then the named service. Stop at the first failing layer and avoid scanning neighbors.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#31644b"/></marker><style>.box{fill:#f1f7f2;stroke:#31644b;stroke-width:4;rx:16}.head{font:700 21px sans-serif;fill:#244335;text-anchor:middle}.body{font:17px sans-serif;fill:#26382e;text-anchor:middle}.arr{stroke:#31644b;stroke-width:6;marker-end:url(#arrow)}</style></defs>
  <rect width="1050" height="290" fill="#fff"/>
  <g transform="translate(25 34)">
    <g><rect class="box" width="155" height="170"/><text class="head" x="77" y="61"><tspan x="77">1. Link</tspan></text><text class="body" x="77" y="105"><tspan x="77">cable · radio</tspan><tspan x="77" dy="22">interface state</tspan></text></g>
    <path class="arr" d="M160 85h20"/><g transform="translate(185)"><rect class="box" width="155" height="170"/><text class="head" x="77" y="61">2. Address</text><text class="body" x="77" y="105"><tspan x="77">expected subnet</tspan><tspan x="77" dy="22">DHCP · static</tspan></text></g>
    <path class="arr" d="M345 85h20"/><g transform="translate(370)"><rect class="box" width="155" height="170"/><text class="head" x="77" y="61">3. Route</text><text class="body" x="77" y="105"><tspan x="77">approved next hop</tspan><tspan x="77" dy="22">policy path</tspan></text></g>
    <path class="arr" d="M530 85h20"/><g transform="translate(555)"><rect class="box" width="155" height="170"/><text class="head" x="77" y="61">4. Name</text><text class="body" x="77" y="105"><tspan x="77">approved resolver</tspan><tspan x="77" dy="22">local diagnostics</tspan></text></g>
    <path class="arr" d="M715 85h20"/><g transform="translate(740)"><rect class="box" width="155" height="170"/><text class="head" x="77" y="61">5. Service</text><text class="body" x="77" y="105"><tspan x="77">named endpoint</tspan><tspan x="77" dy="22">owner confirms</tspan></text></g>
  </g>
  <text x="525" y="252" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#7b3434">Stop at the first failing layer; do not scan neighboring devices.</text>
</svg>
