<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="70mm" viewBox="0 0 1080 350" role="img" aria-labelledby="title desc">
  <title id="title">Field data lifecycle and control points</title>
  <desc id="desc">Six stages: authorize purpose, minimize collection, validate provenance, protect local use, reconcile approved sync, then retain or delete by policy.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#286c72"/></marker><style>.card{fill:#f2f6fc;stroke:#2e587f;stroke-width:4;rx:18}.head{font:700 23px sans-serif;fill:#203e5a;text-anchor:middle}.body{font:18px sans-serif;fill:#25394b;text-anchor:middle}.arr{stroke:#286c72;stroke-width:6;marker-end:url(#arrow)}</style></defs>
  <rect width="1080" height="350" fill="#fff"/>
  <g transform="translate(25 40)">
    <g><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">1. Authorize</tspan><tspan x="75" dy="28">purpose</tspan></text><text class="body" x="75" y="135"><tspan x="75">owner · authority</tspan><tspan x="75" dy="24">review date</tspan></text></g>
    <path class="arr" d="M155 95h20"/><g transform="translate(180)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">2. Minimize</tspan><tspan x="75" dy="28">collection</tspan></text><text class="body" x="75" y="135"><tspan x="75">least fields</tspan><tspan x="75" dy="24">needed for purpose</tspan></text></g>
    <path class="arr" d="M335 95h20"/><g transform="translate(360)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">3. Validate</tspan><tspan x="75" dy="28">provenance</tspan></text><text class="body" x="75" y="135"><tspan x="75">source · time</tspan><tspan x="75" dy="24">uncertainty</tspan></text></g>
    <path class="arr" d="M515 95h20"/><g transform="translate(540)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">4. Protect</tspan><tspan x="75" dy="28">local use</tspan></text><text class="body" x="75" y="135"><tspan x="75">roles · device</tspan><tspan x="75" dy="24">offline copies</tspan></text></g>
    <path class="arr" d="M695 95h20"/><g transform="translate(720)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">5. Reconcile</tspan><tspan x="75" dy="28">approved sync</tspan></text><text class="body" x="75" y="135"><tspan x="75">conflicts reviewed</tspan><tspan x="75" dy="24">by data steward</tspan></text></g>
    <path class="arr" d="M875 95h20"/><g transform="translate(900)"><rect class="card" width="150" height="190"/><text class="head" x="75" y="60"><tspan x="75">6. Retain or</tspan><tspan x="75" dy="28">delete</tspan></text><text class="body" x="75" y="135"><tspan x="75">policy · backup</tspan><tspan x="75" dy="24">authorized closure</tspan></text></g>
  </g>
  <text x="540" y="300" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#7b3434">At every handoff: confirm access, safe purpose, and the accountable owner.</text>
</svg>
